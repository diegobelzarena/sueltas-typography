# A contrario analysis configuration for corpus-1
# Used by scripts/acontrario.py

# ---------------------------------------------------------------------------
# A contrario method parameters
# ---------------------------------------------------------------------------
analysis:
  # NFA threshold (equation 9 in the paper)
  epsilon: 0.01
  # Alpha grid: generates sorted(base * 2^i for base in base_factors, i in exponent_range)
  alphas:
    base_factors: [0.1, 0.15]
    exponent_range: [-5, 3]  # inclusive on both ends
  # Which weight matrix drives the book ordering and graph UMAP distances.
  # "average" = (roman + italic) / 2, "roman" = roman only, "italic" = italic only.
  ordering: "average"
  # Reference corpus for cross-corpus quantile calibration (null = use own).
  # reference_corpus: "data/corpus-1"

# ---------------------------------------------------------------------------
# Printer metadata (for display only — does not affect the analysis)
# ---------------------------------------------------------------------------
printers:
  colors:
    Bedmar: "tab:blue"
    Fajardo: "tab:orange"
    Lyra: "tab:green"
    Pastrana: "tab:red"
    Sande: "tab:purple"
    X: "tab:brown"
    unknown: "black"
  # How to extract a short printer name from the full metadata field.
  # "last_word" keeps the last whitespace-separated token.
  short_name: "last_word"

remarks:
  shapes:
    known: "D"
    hidden: "h"
    new: "*"
    nan: "s"

# ---------------------------------------------------------------------------
# Visualization
# ---------------------------------------------------------------------------
visualization:
  matrix:
    figsize_per_book: 0.2        # side length = factor × number of books
    include_values: false
    cmap: "viridis"
    xticks_rotation: "vertical"
    colorbar: true
    colorbar_step: 5
    # Marker overlay style
    marker_edge_color: "white"
    marker_edge_width: 1.
    # Per-remark marker sizes (scatter `s` units; omit for default = 100)
    marker_sizes:
      known: 50
      hidden: 100
      new: 100
    legend_marker_size: 250
    legend_fontsize: "xx-large"
    legend_loc: "upper right"

  graph:
    figsize: [12, 12]
    n_neighbors: 10
    min_dist: 1
    n_components: 2
    random_state: 0
    scale_factor: 1.0
    node_size: 30
    font_size: 9
    shift_dir: "nw"
    shift_len: 0.1
    edge_width: 0.5
    legend_marker_size: 120
    legend_fontsize: "x-large"
    legend_loc: "lower left"

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output:
  # Directory for figures and results (relative to corpus directory)
  save_dir: "results"
  # File formats for figures
  formats: ["png", "svg"]
  # DPI for raster formats
  dpi: 150
